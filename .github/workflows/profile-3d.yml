name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "5 15 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"
  workflow_dispatch:

permissions:
  contents: write

# 스케줄 실행과 push 실행이 겹쳐 git push가 충돌하는 것을 방지
concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{secrets.README}}  # 직접 만든 PAT 시크릿 이름
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@github.com"
          git add profile-3d-contrib
          if git commit -m "chore: generate 3d contrib"; then
            git pull --rebase --autostash || true
            git push
          fi
